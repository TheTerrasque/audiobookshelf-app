name: Build APK

on:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      # Sign every build with the same key so a new APK installs as an update.
      # DEBUG_KEYSTORE_BASE64 is a base64 PKCS12 keystore with the standard debug
      # credentials (alias androiddebugkey, passwords "android"). android/app/build.gradle
      # signs debug builds with the file in DEBUG_KEYSTORE_FILE. Without the secret Gradle
      # makes a random key.
      - name: install debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the debug keystore from secrets"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, the APK is signed with a random key and will not install as an update"
          fi

      - name: build Android app
        env:
          FORK_BUILD_NUMBER: ${{ github.run_number }}
        run: ./android/gradlew assembleDebug -p android --no-daemon

      # Fail the build rather than publish an APK that can't update the installed app
      - name: verify signing key
        if: env.DEBUG_KEYSTORE_FILE != ''
        run: |
          expected=$(keytool -list -v -keystore "$DEBUG_KEYSTORE_FILE" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/*.apk | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "expected $expected"
          echo "actual   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: rename apk
        id: apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          short="$(git rev-parse --short HEAD)"
          build="$(date +%Y%m%d-%H%M%S)-${short}"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Fork: also publish each build as a pre-release so the plain .apk can be
      # downloaded straight from a phone browser (artifacts are zipped and need a login).
      - name: publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ github.ref_name }} @ ${{ steps.apk.outputs.short }})
          prerelease: true
          body: |
            Debug APK of the "ABS Fork" app, built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Installs alongside the official app (id `io.github.theterrasque.audiobookshelf.debug`).
          files: android/app/build/outputs/apk/debug/*.apk
